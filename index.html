<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151827">
<meta name="description" content="If Only I Knew: a deck of history. One card from history, five minutes a day.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="If Only I Knew">
<title>If Only I Knew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a night-time archive. One story per screen, an era-coloured plate on top, narrated text below. */
:root{
  --bg:#151827;
  --surface:#1e2236;
  --surface-2:#282d46;
  --text:#ece4d3;
  --muted:#a8a192;
  --brass:#d6a64f;
  --line:rgba(236,228,211,.13);
  --good:#86c596;
  --bad:#e3826f;
  --display:'IM Fell English','Iowan Old Style',Georgia,serif;
  --sc:'IM Fell English SC','Iowan Old Style',Georgia,serif;
  --body:'Literata',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 48px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-weight:400;margin:0;text-wrap:balance}
.sc{font-family:var(--sc);letter-spacing:.06em;color:var(--muted);font-size:15px}

/* Home */
.mast{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:14px;color:var(--brass);letter-spacing:.12em}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:54px;flex:none;overflow:visible}
.m-back{fill:var(--surface);stroke:color-mix(in srgb,var(--brass) 50%,transparent);stroke-width:1.5}
.m-front{fill:var(--surface-2);stroke:var(--brass);stroke-width:1.8}
.m-line{fill:none;stroke:var(--brass);stroke-width:1.6;stroke-linejoin:round}
.m-fill{fill:var(--brass)}
.mast h1{font-family:var(--display);font-style:italic;font-size:42px;line-height:1;color:var(--text)}
.mast h1 span{color:var(--brass)}
.mast p{margin:0;color:var(--muted);font-size:16px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--text);background:var(--surface);font-variant-numeric:tabular-nums}
.chip b{color:var(--brass);font-weight:600}

.feature{border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);text-align:left;padding:0;width:100%;display:block}
.plate{position:relative;height:210px;display:flex;align-items:flex-end;justify-content:space-between;padding:16px 18px;overflow:hidden;
  background:
    radial-gradient(120% 90% at 85% 10%, color-mix(in srgb,var(--era) 75%, #fff 0%) 0%, transparent 60%),
    linear-gradient(160deg, color-mix(in srgb,var(--era) 85%, #000) 0%, color-mix(in srgb,var(--era) 35%, #0d0f18) 100%);}
.plate .scene{position:absolute;inset:0;z-index:0}
.plate .scene svg{width:100%;height:100%;display:block}
.plate::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(8,8,14,.6));z-index:1;pointer-events:none}
.plate .cap{position:relative;z-index:2;display:flex;flex-direction:column;gap:4px}
.plate .year{font-family:var(--display);font-size:44px;line-height:.9;color:rgba(255,248,232,.95)}
.plate .nm{font-family:var(--display);font-style:italic;font-size:21px;line-height:1.1;color:#fff8e8}
.plate .pl{position:relative;z-index:2;color:rgba(255,248,232,.88);text-align:right;max-width:45%}
.feature .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px}
.feature h2{font-family:var(--display);font-size:30px;line-height:1.1}
.feature .kicker{color:var(--muted);font-size:15px}
.cta{margin-top:10px;align-self:flex-start;background:var(--brass);color:#1b1608;border:0;border-radius:999px;padding:10px 20px;font-weight:600;font-size:16px}

.path{display:flex;flex-direction:column;gap:10px}
.path-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px}
.path-head h3{font-family:var(--display);font-size:24px}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .t{font-family:var(--display);font-size:20px;line-height:1.2}
.row .k{color:var(--muted);font-size:14px}
.pill{font-size:13px;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.done{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.pill.new{color:var(--brass);border-color:color-mix(in srgb,var(--brass) 45%,transparent)}

.medal{--size:48px;width:var(--size);height:var(--size);border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--era) 70%, #fff 18%), color-mix(in srgb,var(--era) 75%, #000) 75%);
  box-shadow:inset 0 0 0 2px rgba(255,240,210,.35), 0 0 0 2px color-mix(in srgb,var(--brass) 60%, transparent);color:#fff8e8}
.medal svg{width:55%;height:55%}
.medal.locked{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--line);color:var(--muted)}
.medal.locked svg{opacity:.35}

.link{background:none;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left}
.link .medals{display:flex}
.link .medals .medal{--size:30px;margin-left:-8px}
.foot{color:var(--muted);font-size:14px;margin:0}

/* Scoreboard + requests */
.board{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:4px 14px}
.prow{display:grid;grid-template-columns:24px 36px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.rank{font-family:var(--display);font-size:22px;color:var(--brass);text-align:center}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--surface-2)}
.pn{font-family:var(--display);font-size:19px;line-height:1.15}
.ps{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.px{font-variant-numeric:tabular-nums;font-weight:600;color:var(--brass);white-space:nowrap}
.note{color:var(--muted);font-size:14px;margin:0;padding:10px 0}
.field{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px}
textarea.field{min-height:84px;resize:vertical}
.field:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.form{display:flex;flex-direction:column;gap:10px}
.form .rowb{display:flex;justify-content:space-between;align-items:center;gap:10px}
.small{background:var(--brass);color:#1b1608;border:0;border-radius:999px;padding:9px 18px;font-weight:600;font-size:15px}
.small:disabled{opacity:.4;cursor:default}
.nick{display:flex;gap:8px;padding:10px 0}
.rqs{display:flex;flex-direction:column}
.rq{border-bottom:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:2px}
.rq:last-child{border-bottom:0}
.rq .by{color:var(--muted);font-size:13px}
.rq .tx{white-space:pre-wrap;overflow-wrap:anywhere}

/* Generated artwork, decks and cards */
canvas.art{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.decks{display:flex;flex-direction:column;gap:10px}
.deck{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.deck summary{list-style:none;cursor:pointer;position:relative;min-height:78px;display:grid;grid-template-columns:1fr auto 14px;align-items:end;gap:12px;padding:12px 14px;overflow:hidden}
.deck summary::-webkit-details-marker{display:none}
.deck summary::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,8,14,.78),rgba(8,8,14,.2) 75%);z-index:1}
.deck summary>span{position:relative;z-index:2}
.deck summary:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.dk-t{display:flex;flex-direction:column;gap:2px}
.dk-t .sc{font-size:12px;color:rgba(255,248,232,.78)}
.dk-t b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.05;color:#fff8e8}
.dk-m{display:flex;flex-direction:column;align-items:flex-end;gap:6px;color:#fff8e8;font-size:13px;font-variant-numeric:tabular-nums}
.dk-bar{width:64px;height:4px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
.dk-bar i{display:block;height:100%;background:var(--brass)}
.chev{width:10px;height:10px;border-right:2px solid #fff8e8;border-bottom:2px solid #fff8e8;transform:rotate(45deg);margin-bottom:9px;transition:transform .2s}
.deck[open] .chev{transform:rotate(-135deg);margin-bottom:3px}
.dk-body{padding:2px 14px 4px}
.dk-body .note{padding:10px 0 2px}
.row{grid-template-columns:42px 1fr auto}
.mini{position:relative;width:42px;height:58px;border-radius:7px;overflow:hidden;display:grid;place-items:center;background:var(--era,var(--surface-2));box-shadow:0 0 0 1px color-mix(in srgb,var(--brass) 55%,transparent)}
.mi{position:relative;z-index:1;width:22px;height:22px;color:#fff8e8;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.mi svg{width:100%;height:100%;display:block}
.mini.locked canvas{filter:grayscale(.85) brightness(.55)}
.mini.back,.pcard.back{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--brass) 24%,transparent) 0 2px,transparent 2px 11px),repeating-linear-gradient(-45deg,color-mix(in srgb,var(--brass) 24%,transparent) 0 2px,transparent 2px 11px),#1b2036}
.fan{display:flex;padding-right:8px}
.fan-c{margin-left:-14px;transform:rotate(calc((var(--k) - 1.5) * 8deg));transform-origin:50% 120%}
.fan-c .mini{width:34px;height:47px}
.fan-c .mi{width:17px;height:17px}
.hero{position:relative;height:88px;border-radius:14px;overflow:hidden;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:10px 14px;flex:none;
  background:linear-gradient(160deg,color-mix(in srgb,var(--era) 85%,#000),color-mix(in srgb,var(--era) 35%,#0d0f18))}
.hero .scene{position:absolute;inset:0}
.hero .scene svg{width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,8,14,.7),rgba(8,8,14,.1) 70%);z-index:1}
.hcap{position:relative;z-index:2;display:flex;flex-direction:column}
.hy{font-family:var(--display);font-size:26px;line-height:1;color:#fff8e8}
.hn{font-family:var(--display);font-style:italic;font-size:17px;color:#fff8e8}
.hd{position:relative;z-index:2;font-family:var(--sc);font-size:13px;letter-spacing:.04em;color:rgba(255,248,232,.92);text-align:right;max-width:52%;text-wrap:balance}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.cardbtn{background:none;border:0;padding:0;display:block;text-align:left}
.pcard{position:relative;display:flex;flex-direction:column;width:100%;aspect-ratio:5/7;border-radius:12px;overflow:hidden;background:var(--surface-2);
  box-shadow:0 0 0 1.5px color-mix(in srgb,var(--brass) 60%,transparent),0 8px 22px rgba(0,0,0,.35)}
.pc-art{position:relative;flex:0 0 56%;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--era) 85%,#000),color-mix(in srgb,var(--era) 35%,#0d0f18))}
.pc-art .scene{position:absolute;inset:0}
.pc-art .scene svg{width:100%;height:100%;display:block}
.pc-corner{position:absolute;top:6px;left:6px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:3px;background:rgba(10,10,18,.6);border-radius:8px;padding:5px 6px;color:#fff8e8}
.pc-corner b{font-family:var(--display);font-weight:400;font-size:13px;line-height:1}
.pc-corner svg{width:14px;height:14px}
.pc-body{flex:1;display:flex;flex-direction:column;gap:3px;padding:8px 10px;border-top:2px solid color-mix(in srgb,var(--era) 70%,var(--brass))}
.pc-n{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.1}
.pc-e{font-family:var(--display);font-style:italic;color:var(--brass);font-size:13px;line-height:1.2}
.pc-d{margin-top:auto;font-family:var(--sc);color:var(--muted);font-size:11px;letter-spacing:.05em}
.pcard.big{width:240px}
.pcard.big .pc-n{font-size:25px}
.pcard.big .pc-e{font-size:16px}
.pcard.big .pc-d{font-size:13px}
.pcard.big .pc-corner b{font-size:16px}
.pcard.big .pc-corner svg{width:18px;height:18px}
.pb-in{position:absolute;inset:8px;border:1.5px solid color-mix(in srgb,var(--brass) 55%,transparent);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
.pb-mono{font-family:var(--display);font-style:italic;font-size:34px;color:var(--brass);width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--bg);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--brass) 55%,transparent)}
.pb-deck{font-family:var(--sc);font-size:11px;color:var(--muted);text-align:center}
.pb-t{font-family:var(--display);font-size:14px;line-height:1.15;color:var(--text);text-align:center;text-wrap:balance}
.finish .pcard{animation:deal .9s cubic-bezier(.2,1.2,.3,1) both}
@keyframes deal{0%{transform:perspective(900px) rotateY(95deg) translateY(24px);opacity:.35}100%{transform:none;opacity:1}}


.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff8e8;font-family:var(--display);font-size:18px}
.textbtn{background:none;border:0;padding:0;color:var(--brass);text-decoration:underline;text-underline-offset:3px;font:inherit;cursor:pointer}

.rank-card{display:grid;grid-template-columns:auto 1fr 12px;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid color-mix(in srgb,var(--brass) 40%,var(--line));border-radius:16px;padding:12px 14px}
.rk{display:flex;flex-direction:column;gap:3px}
.rk .sc{font-size:12px}
.rk b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.05}
.rk-bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:3px}
.rk-bar i{display:block;height:100%;background:var(--brass)}
.rk-next{font-size:13px;color:var(--muted)}
.chev-r{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg)}
.seal{--s:40px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 35% 30%,#f0cf86,#d6a64f 45%,#9c7428 100%);
  box-shadow:inset 0 0 0 calc(var(--s)*.06) rgba(255,240,200,.55),inset 0 0 0 calc(var(--s)*.11) #b8862b,0 2px 8px rgba(0,0,0,.35)}
.seal b{font-family:var(--display);font-weight:400;font-size:calc(var(--s)*.38);line-height:1;color:#2a1d06;letter-spacing:.02em}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ladder li{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ladder li b{font-family:var(--display);font-weight:400;font-size:21px}
.ladder li .k{color:var(--muted);font-size:14px}
.ladder li.locked .seal{filter:grayscale(1) brightness(.8);opacity:.7}
.ladder li.locked b{color:var(--muted)}
.ladder li.now{background:color-mix(in srgb,var(--brass) 8%,transparent);border-radius:12px;padding:12px 10px;margin:0 -10px}
.dk-done{font-family:var(--sc);font-size:12px;letter-spacing:.06em;color:#2a1d06;background:linear-gradient(135deg,#f0cf86,#d6a64f);border-radius:999px;padding:3px 10px}
.rankup{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:4px 0 10px}
.rankup .seal{animation:stamp .7s cubic-bezier(.2,1.4,.4,1) both}
.rankup b{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1}
.rankup i{font-family:var(--display);color:var(--brass);font-size:17px}
.rankup .sc{color:var(--brass);letter-spacing:.14em}
.deckdone{margin:0;font-family:var(--display);font-style:italic;color:var(--brass);font-size:19px}
.rq.made .tx{color:var(--muted)}
.added{background:none;border:0;padding:4px 0 0;color:var(--good);font:inherit;font-size:14px;text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.tabs{display:flex;align-items:center;gap:6px;padding:10px 0 6px}
.tabs button{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--brass);border-color:var(--brass);color:#1b1608;font-weight:600}
.tabs .k{margin-left:auto;font-size:12px;color:var(--muted)}
.flash-card{display:grid;grid-template-columns:auto 1fr 12px;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.flash-card b{font-family:var(--display);font-weight:400;font-size:21px}
.flash-card .k{color:var(--muted);font-size:14px}
.flash-card.locked{opacity:.7}
.fl-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--brass);background:color-mix(in srgb,var(--brass) 14%,var(--surface-2))}
.fl-ico svg{width:26px;height:26px}
.fl-big{width:96px;height:96px;border-radius:24px;display:grid;place-items:center;color:var(--brass);background:color-mix(in srgb,var(--brass) 14%,var(--surface-2));animation:stamp .7s cubic-bezier(.2,1.4,.4,1) both}
.fl-big svg{width:56px;height:56px}
.fl-score{font-family:var(--display);font-size:40px}
.rowb2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cta.ghost{background:none;color:var(--text);border:1px solid var(--line)}
.shield{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.shield.used{color:var(--muted);border-color:var(--line)}
.shieldnote{margin:0;color:var(--good);font-size:15px}
.reqby{margin:0;font-family:var(--display);font-style:italic;color:var(--brass);font-size:17px}
.dk-new{color:#f0cf86;font-weight:600}
.bhead{display:flex;justify-content:space-between;gap:10px;padding:10px 0 4px;font-size:12px;color:var(--muted)}
.px2{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums;white-space:nowrap}
.px2 b{color:var(--brass);font-weight:600}
.px2 span{font-size:12px;color:var(--muted)}
.tour{position:fixed;inset:0;z-index:100}
.tour.dim{background:rgba(5,6,14,.72)}
.tour-hole{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(5,6,14,.72);outline:2px solid var(--brass);outline-offset:0;transition:left .25s,top .25s,width .25s,height .25s;pointer-events:none}
.tour-tip{position:fixed;left:16px;right:16px;max-width:440px;margin:0 auto;background:var(--surface-2);border:1px solid color-mix(in srgb,var(--brass) 70%,transparent);border-radius:16px;padding:14px 16px;box-shadow:0 12px 32px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:6px}
.tour-tip h3{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.tour-tip p{margin:0;font-size:16px;line-height:1.5}
.tour-tip .sc{font-size:12px;color:var(--brass)}
.tour-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.tour-dots{display:flex;gap:5px}
.tour-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.tour-dots i.on{background:var(--brass)}
@media (prefers-reduced-motion:reduce){.tour-hole{transition:none}}
/* Story */
.story{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.bar{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:15px}
.iconbtn.on{background:var(--brass);color:#1b1608;border-color:var(--brass)}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.segs i.f{background:var(--brass)}
.stage{flex:1;display:flex;flex-direction:column;padding:0 16px 16px;gap:14px}
.stage .plate{border-radius:18px;height:210px}
.fig{display:flex;align-items:center;gap:14px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.vig{width:60px;height:60px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff8e8;background:linear-gradient(150deg,color-mix(in srgb,var(--era) 85%,#fff 8%),color-mix(in srgb,var(--era) 55%,#000))}
.vig svg{width:34px;height:34px}
.fig .lab{display:flex;flex-direction:column;gap:1px}
.fig .lab .sc{font-size:13px}
.fig .lab b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2}
.chapter{display:flex;flex-direction:column;gap:10px;animation:rise .35s ease both}
.chapter .sc{font-size:15px}
.chapter h2{font-family:var(--display);font-size:28px;line-height:1.1}
.chapter p{margin:0;font-size:19px;line-height:1.6;max-width:62ch}
.nav{display:flex;gap:10px;padding:12px 16px calc(16px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:linear-gradient(transparent, var(--bg) 30%)}
.nav button{flex:1;border-radius:999px;padding:13px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.nav button.primary{background:var(--brass);color:#1b1608;border-color:var(--brass);font-weight:600;flex:2}
.nav button:disabled{opacity:.35;cursor:default}

/* Quiz */
.q{display:flex;flex-direction:column;gap:12px;animation:rise .35s ease both}
.q h2{font-family:var(--display);font-size:28px;line-height:1.15}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:17px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%, var(--surface));}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%, var(--surface));}
.opt:disabled{cursor:default}
.why{border-left:3px solid var(--brass);padding:4px 0 4px 14px;margin:4px 0 0;color:var(--text)}
.why b{color:var(--brass);font-weight:600}

/* Done */
.finish{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:36px 20px 24px;max-width:520px;margin:0 auto}
.finish .medal{--size:150px;animation:stamp .7s cubic-bezier(.2,1.4,.4,1) both}
.finish .medal::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--brass) 55%, transparent);animation:spin 24s linear infinite}
.finish h2{font-family:var(--display);font-size:36px;line-height:1.05}
.finish .ep{font-family:var(--display);font-style:italic;color:var(--brass);font-size:20px;margin:-6px 0 0}
.score{font-variant-numeric:tabular-nums;color:var(--muted);margin:0}
.take{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:6px}
.take p{margin:0}
.finish .cta{align-self:center}

/* Collection */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.card .medal{--size:74px}
.card .n{font-family:var(--display);font-size:19px;line-height:1.15}
.card .e{color:var(--muted);font-size:13px;line-height:1.35}
.back{align-self:flex-start}

@keyframes rise{from{opacity:.45;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes stamp{0%{transform:scale(1.6) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.mast h1{font-size:35px}.mark{width:36px;height:46px}.chapter p{font-size:18px}}
</style>
</head>
<body>
<main id="app"></main>
<script src="decks.js"></script>
<script src="app.js"></script>
</body>
</html>
